name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo. Unspecified scopes are none.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev libdbus-1-dev mpv
      # `@stable` is not a commit on master (those refs are garbage-collected).
      # Pin a master commit and select the channel with `toolchain`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # VITRA_MPV_TESTS also runs crates/mpv-ipc/tests/real_mpv.rs against the system mpv.
      - run: cargo test --workspace
        env:
          VITRA_MPV_TESTS: '1'
          VITRA_MPV_ARGS: --ao=null
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: sidecar-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: sidecar-archives-v2-${{ hashFiles('scripts/sidecars/plan.mjs', 'scripts/sidecars/ytdlp-release.mjs') }}-x86_64-unknown-linux-gnu-ffmpeg
      - id: fetch-sidecars-ffmpeg
        env:
          VITRA_SIDECAR_ARCHIVE_CACHE: ${{ github.workspace }}/.cache/vitra-sidecar-archives
        run: node scripts/fetch-sidecars.mjs --only ffmpeg --require-checksums
      - name: Save verified sidecar archives
        if: >-
          steps.fetch-sidecars-ffmpeg.outcome == 'success' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: ${{ steps.sidecar-archive-cache.outputs.cache-primary-key }}
      - name: Authenticate HTTPS with the release FFmpeg sidecar
        run: python3 scripts/test-ffmpeg-tls.py --ffmpeg src-tauri/sidecars/x86_64-unknown-linux-gnu/ffmpeg

  cross:
    name: Rust (macOS + Windows type-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc
      - name: Install llvm-rc (Windows icon resource)
        run: sudo apt-get update && sudo apt-get install -y llvm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sh scripts/cross-check/run.sh

  ytdlp:
    name: yt-dlp (real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The pinned yt-dlp release; a failure here means yt-dlp's output changed.
      - id: sidecar-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: sidecar-archives-v2-${{ hashFiles('scripts/sidecars/plan.mjs', 'scripts/sidecars/ytdlp-release.mjs') }}-x86_64-unknown-linux-gnu-yt-dlp
      - id: fetch-sidecars-ytdlp
        env:
          VITRA_SIDECAR_ARCHIVE_CACHE: ${{ github.workspace }}/.cache/vitra-sidecar-archives
        run: node scripts/fetch-sidecars.mjs --only yt-dlp
      - name: Save verified sidecar archives
        if: >-
          steps.fetch-sidecars-ytdlp.outcome == 'success' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: ${{ steps.sidecar-archive-cache.outputs.cache-primary-key }}
      - run: cargo test -p links --test real_ytdlp
        env:
          VITRA_YTDLP: ${{ github.workspace }}/src-tauri/sidecars/x86_64-unknown-linux-gnu/yt-dlp

  macos:
    name: Rust (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Linux CI can't catch macOS-only behavior (sidecar layouts, the ditto-based installer).
      - run: cargo test --workspace
      # yt-dlp's folder build and the macOS FFmpeg, set up the way developers get them.
      - id: sidecar-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: sidecar-archives-v2-${{ hashFiles('scripts/sidecars/plan.mjs', 'scripts/sidecars/ytdlp-release.mjs') }}-aarch64-apple-darwin-yt-dlp,ffmpeg
      - id: fetch-sidecars-macos
        env:
          VITRA_SIDECAR_ARCHIVE_CACHE: ${{ github.workspace }}/.cache/vitra-sidecar-archives
        run: node scripts/fetch-sidecars.mjs --only yt-dlp,ffmpeg
      - name: Save verified sidecar archives
        if: >-
          steps.fetch-sidecars-macos.outcome == 'success' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: ${{ steps.sidecar-archive-cache.outputs.cache-primary-key }}
      - name: Authenticate HTTPS with the macOS FFmpeg sidecar
        run: python3 scripts/test-ffmpeg-tls.py --ffmpeg src-tauri/sidecars/aarch64-apple-darwin/ffmpeg
      - run: cargo test -p links --test real_ytdlp
        env:
          VITRA_YTDLP: ${{ github.workspace }}/src-tauri/sidecars/aarch64-apple-darwin/yt-dlp/yt-dlp_macos
          VITRA_FFMPEG: ${{ github.workspace }}/src-tauri/sidecars/aarch64-apple-darwin/ffmpeg

  windows:
    name: Rust (Windows)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # Same target dir the release workflow caches, so a warm cache can be reused.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: npm ci
      # Same verified Windows sidecars the release job fetches before its tests.
      # Workspace tests do not launch them; real mpv / yt-dlp / FFmpeg runs stay
      # opt-in (no VITRA_MPV_TESTS or VITRA_YTDLP here), matching `npm run check:all`.
      - id: sidecar-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: sidecar-archives-v2-${{ hashFiles('scripts/sidecars/plan.mjs', 'scripts/sidecars/ytdlp-release.mjs') }}-x86_64-pc-windows-msvc-mpv,yt-dlp,ffmpeg,deno
      - name: Fetch verified audio components
        id: fetch-sidecars-windows
        env:
          VITRA_SIDECAR_ARCHIVE_CACHE: ${{ github.workspace }}/.cache/vitra-sidecar-archives
        run: npm run fetch-sidecars -- --target x86_64-pc-windows-msvc --require-checksums
      - name: Save verified sidecar archives
        if: >-
          steps.fetch-sidecars-windows.outcome == 'success' &&
          (github.event_name == 'push' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: ${{ steps.sidecar-archive-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: cargo test --workspace --no-fail-fast
