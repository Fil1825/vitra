name: Release candidates

on:
  push:
    branches: [main, codex/stage-11-release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Use Developer ID and notarization (requires configured Apple secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            config: ''
          - name: macOS-Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            config: --config src-tauri/tauri.intel.conf.json
          - name: Windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: ''
          - name: Linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            config: --config src-tauri/tauri.linux.conf.json
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign_macos && secrets.APPLE_SIGNING_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies and playback engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev mpv
      - run: npm ci
      - name: Check release version
        run: node scripts/release/check-version.mjs
      - name: Fetch verified audio components
        run: npm run fetch-sidecars -- --target ${{ matrix.target }} --require-checksums
      - name: Require official macOS signing credentials
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" || "${!name}" == '-' ]]; then
              echo "Required signing setting is missing: $name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && inputs.sign_macos
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Sign nested macOS components
        if: runner.os == 'macOS'
        run: node scripts/release/run-checked.mjs "node scripts/release/sign-macos.mjs src-tauri/sidecars/${{ matrix.target }}"
      - name: Run quality checks and native unit tests
        run: node scripts/release/run-checked.mjs "npm run check:all"
      - name: Build installer with audio components
        run: npm run bundle -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.config }}
        env:
          APPLE_ID: ${{ inputs.sign_macos && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign_macos && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign_macos && secrets.APPLE_TEAM_ID || '' }}
      - name: Verify the app inside the finished macOS disk image
        if: runner.os == 'macOS'
        run: python3 scripts/release/verify-macos.py target/${{ matrix.target }}/release/bundle/dmg ${{ matrix.target }} ${{ inputs.sign_macos && '--signed' || '' }}
      - name: Verify Debian dependencies and packaged components
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=(target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#package[@]}" = 1
          dpkg-deb -f "${package[0]}" Depends | grep -E '(^|, )mpv([ ,(]|$)'
          dpkg-deb -x "${package[0]}" "$RUNNER_TEMP/vitra-installed"
          node scripts/release/verify-sidecars.mjs "$RUNNER_TEMP/vitra-installed" '${{ matrix.target }}'
      - name: Install the Windows package and verify its components
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($packages.Count -ne 1) { throw 'Expected one Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Vitra-installed'
          $installer = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          node scripts/release/verify-sidecars.mjs $installDir '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged components failed verification' }
      - name: Save verified installer and component provenance
        uses: actions/upload-artifact@v7
        with:
          name: Vitra-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/sidecars/${{ matrix.target }}/manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish tested prerelease installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Vitra-*
          path: installers
      - name: Collect installers and component manifests
        shell: bash
        run: |
          mkdir release-assets
          for directory in installers/Vitra-*; do
            name=$(basename "$directory")
            mapfile -d '' packages < <(find "$directory" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \) -print0)
            test "${#packages[@]}" = 1
            package=${packages[0]}
            cp "$package" "release-assets/$name.${package##*.}"
            mapfile -d '' manifests < <(find "$directory" -type f -name manifest.json -print0)
            test "${#manifests[@]}" = 1
            cp "${manifests[0]}" "release-assets/$name.manifest.json"
          done
          (cd release-assets && sha256sum ./* > SHA256SUMS)
      - name: Publish prerelease after all platform checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Refusing to replace a public release' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --title "Vitra $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
