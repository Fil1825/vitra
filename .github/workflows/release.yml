name: Release candidates

# A pull request builds only macOS-Intel. Pushing the branch is that launch.
# workflow_dispatch is not required. A push to main does not run this file.
# A v* tag still builds all four platforms; that is not this candidate's path.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/build-intel-mpv.sh
      - scripts/release/intel-mpv-sources.json
      - scripts/release/intel-mpv-sources.test.mjs
      - scripts/release/app-payload.mjs
      - scripts/release/app-payload.test.mjs
      - scripts/release/reused-artifacts.json
      - scripts/release/reused-artifacts.mjs
      - scripts/release/reused-artifacts.test.mjs
      - scripts/release/publish-reused.mjs
      - docs/dev/MACOS-INTEL-MONTEREY.md
  workflow_dispatch:
    inputs:
      scope:
        description: 'intel-only builds macOS-Intel. full builds four platforms. publish-pinned builds nothing. The Actions tool catalog cannot dispatch this.'
        type: choice
        options:
          - intel-only
          - full
          - publish-pinned
        default: intel-only
      publish_release:
        description: 'Publish after the full four-platform build (main only). This does not publish the pinned mixed-run artifacts.'
        type: boolean
        default: false
      sign_macos:
        description: 'Use Developer ID and notarization (requires configured Apple secrets)'
        type: boolean
        default: false
      sign_windows:
        description: 'Authenticode-sign the NSIS installer (requires WINDOWS_* secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    if: >-
      (github.event_name == 'pull_request' && matrix.name == 'macOS-Intel') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'intel-only' && matrix.name == 'macOS-Intel')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            config: ''
          - name: macOS-Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            config: --config src-tauri/tauri.intel.conf.json
          - name: Windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            config: ''
          - name: Linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            config: --config src-tauri/tauri.linux.conf.json
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_SIGNING_IDENTITY: ${{ inputs.sign_macos && secrets.APPLE_SIGNING_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the commit that built the reused installers
        if: matrix.name == 'macOS-Intel' && github.event_name != 'push'
        run: git fetch --no-tags https://github.com/Fil1825/vitra.git 76ea04250e88d880c3b6a7e3abf182f29c6bbde2
      - name: Refuse an Intel installer whose application sources differ
        if: matrix.name == 'macOS-Intel' && github.event_name != 'push'
        run: node scripts/release/app-payload.mjs
      # `@stable` is not a commit on master (those refs are garbage-collected).
      # Pin a master commit and select the channel with `toolchain`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - name: Install Linux build dependencies and playback engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev mpv
      - run: npm ci
      - name: Check release version
        run: node scripts/release/check-version.mjs
      - id: sidecar-archive-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: sidecar-archives-v3-${{ hashFiles('scripts/sidecars/plan.mjs', 'scripts/sidecars/ytdlp-release.mjs') }}-${{ matrix.target }}-mpv_yt-dlp_ffmpeg_deno
      - name: Fetch verified audio components
        id: fetch-sidecars
        env:
          VITRA_SIDECAR_ARCHIVE_CACHE: ${{ github.workspace }}/.cache/vitra-sidecar-archives
        run: npm run fetch-sidecars -- --target ${{ matrix.target }} --require-checksums
      - name: Save verified sidecar archives
        if: steps.fetch-sidecars.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/vitra-sidecar-archives
          key: ${{ steps.sidecar-archive-cache.outputs.cache-primary-key }}
      - name: Verify Intel mpv bundle load closure
        if: matrix.target == 'x86_64-apple-darwin'
        run: python3 scripts/release/mach-deps.py src-tauri/sidecars/x86_64-apple-darwin/mpv/mpv.app --warn-stale-rpath
      - name: Strip stale builder RPATHs from Intel mpv
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: node scripts/release/strip-macos-rpaths.mjs src-tauri/sidecars/x86_64-apple-darwin/mpv/mpv.app
      - name: Require official macOS signing credentials
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" || "${!name}" == '-' ]]; then
              echo "Required signing setting is missing: $name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && inputs.sign_macos
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Sign nested macOS components
        if: runner.os == 'macOS'
        run: node scripts/release/run-checked.mjs "node scripts/release/sign-macos.mjs src-tauri/sidecars/${{ matrix.target }}"
      - name: Require Windows signing credentials
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          foreach ($name in 'WINDOWS_CERTIFICATE','WINDOWS_CERTIFICATE_PASSWORD') {
            if (-not (Get-Item "Env:$name" -ErrorAction SilentlyContinue)?.Value) {
              throw "Required signing setting is missing: $name"
            }
          }
      - name: Run quality checks and native unit tests
        run: node scripts/release/run-checked.mjs "npm run check:all"
      - name: Build installer with audio components
        shell: bash
        run: |
          # Empty credentials still enable Tauri's notarization path. Ad-hoc builds
          # must leave them absent, while signed runs keep the configured secrets.
          if [[ "$APPLE_SIGNING_IDENTITY" == '-' ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          EXTRA_CONFIG=""
          if [[ "${{ runner.os }}" == "Windows" && "${{ inputs.sign_windows }}" == "true" ]]; then
            EXTRA_CONFIG=$(pwsh -NoProfile -File scripts/release/windows-trusted-bundle.ps1)
          fi
          npm run bundle -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.config }} ${EXTRA_CONFIG:+--config "$EXTRA_CONFIG"}
        env:
          APPLE_ID: ${{ inputs.sign_macos && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign_macos && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign_macos && secrets.APPLE_TEAM_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ inputs.sign_windows && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.sign_windows && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($packages.Count -ne 1) { throw 'Expected one Windows installer' }
          node scripts/release/sign-windows.mjs $packages[0].FullName
      - name: Remove imported Windows signing certificate
        if: runner.os == 'Windows' && inputs.sign_windows
        shell: pwsh
        run: pwsh -NoProfile -File scripts/release/windows-remove-signing-cert.ps1
      - name: Verify the app inside the finished macOS disk image
        if: runner.os == 'macOS'
        run: python3 scripts/release/verify-macos.py target/${{ matrix.target }}/release/bundle/dmg ${{ matrix.target }} ${{ inputs.sign_macos && '--signed' || '' }}
      - name: Verify Debian dependencies and packaged components
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=(target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#package[@]}" = 1
          dpkg-deb -f "${package[0]}" Depends | grep -E '(^|, )mpv([ ,(]|$)'
          dpkg-deb -x "${package[0]}" "$RUNNER_TEMP/vitra-installed"
          node scripts/release/verify-sidecars.mjs "$RUNNER_TEMP/vitra-installed" '${{ matrix.target }}'
      - name: Install the Windows package and verify its components
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*.exe')
          if ($packages.Count -ne 1) { throw 'Expected one Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Vitra-installed'
          $installer = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          node scripts/release/verify-sidecars.mjs $installDir '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged components failed verification' }
      - name: Save verified installer and component provenance
        uses: actions/upload-artifact@v7
        with:
          name: Vitra-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/sidecars/${{ matrix.target }}/manifest.json
            src-tauri/sidecars/${{ matrix.target }}/mpv-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  source-kit:
    name: Corresponding source (prepare)
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Stage pinned source archives without publishing
        run: node scripts/release/stage-source-offers.mjs --mode prepare corresponding-source
      - uses: actions/upload-artifact@v7
        with:
          name: corresponding-source
          path: corresponding-source
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tested prerelease installers
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'full' && inputs.publish_release && github.ref == 'refs/heads/main')
    needs: [build, source-kit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: Vitra-*
          path: installers
      - uses: actions/download-artifact@v8
        with:
          name: corresponding-source
          path: corresponding-source
      - name: Collect installers and component manifests
        shell: bash
        run: |
          mkdir release-assets
          for directory in installers/Vitra-*; do
            name=$(basename "$directory")
            mapfile -d '' packages < <(find "$directory" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \) -print0)
            test "${#packages[@]}" = 1
            package=${packages[0]}
            cp "$package" "release-assets/$name.${package##*.}"
            mapfile -d '' manifests < <(find "$directory" -type f -name manifest.json -print0)
            test "${#manifests[@]}" = 1
            cp "${manifests[0]}" "release-assets/$name.manifest.json"
            mapfile -d '' sources < <(find "$directory" -type f -name 'mpv-corresponding-source.tar.gz' -print0)
            if [[ ${#sources[@]} -gt 0 ]]; then
              cp "${sources[0]}" "release-assets/$name.mpv-corresponding-source.tar.gz"
            fi
          done
      - name: Refuse publication unless corresponding source is closed
        shell: bash
        run: |
          node scripts/release/stage-source-offers.mjs --mode publish --assets release-assets corresponding-source
          tar -czf release-assets/corresponding-source.tar.gz corresponding-source
          (cd release-assets && sha256sum ./* > SHA256SUMS)
      - name: Publish prerelease after all platform checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node scripts/release/check-version.mjs
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="v$(node -p "require('./package.json').version")"
          fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'Refusing to replace a public release' >&2; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$RELEASE_SHA" --draft --title "Vitra $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false

  # Checks the three reused artifacts plus a future Intel pin without building.
  # It does not create a release. workflow_dispatch is not available to the
  # Actions tool catalog (get/list only), and a Cloud VM dispatch previously
  # returned 403. This pull request does not run the job.
  publish-pinned:
    name: Check pinned installers
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'publish-pinned' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refuse unless four pins and the source gate both hold
        run: node scripts/release/publish-reused.mjs
