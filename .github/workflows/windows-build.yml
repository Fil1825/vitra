name: Build Vitra for Windows

on:
  push:
    branches: [codex/windows-test-build]
    paths:
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out application source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: x64
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Download audio components
        run: npm run fetch-sidecars

      - name: Build Windows installer with audio components
        run: npm run bundle -- --bundles nsis

      - name: Save installer
        uses: actions/upload-artifact@v7
        with:
          name: Vitra-Windows-x64-${{ github.run_number }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
