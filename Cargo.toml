[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/Fil1825/vitra"
authors = ["Vitra contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true

# The analysis is arithmetic on a minute and a half of audio: unoptimized, one track takes
# seconds in debug builds and tests.
[profile.dev.package.mood]
opt-level = 2
