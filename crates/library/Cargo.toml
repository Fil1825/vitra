[package]
name = "library"
description = "Vitra's music library: SQLite storage, folder scanning, search, playlists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
media = { path = "../media" }
# What an imported playlist's entries are (stage 9).
import = { path = "../import" }
lyrics = { path = "../lyrics" }
# What a track sounds like and what the wave needs to know about it (stage 10).
mood = { path = "../mood" }
# `bundled` compiles SQLite with FTS5, so search works the same on every platform.
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"
# Makes test images (already in the tree through `media`).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
