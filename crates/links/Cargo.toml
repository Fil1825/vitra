[package]
name = "links"
description = "Playing and downloading from links: URL classification, yt-dlp metadata, downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Already in the tree via Tauri; parses pasted links.
url = "2.5"
# Already in the tree via Tauri; checks yt-dlp release files against their signed hashes.
sha2 = "0.11"
# Pure-Rust OpenPGP. Verifies yt-dlp's detached signature over SHA2-256SUMS.
# Default features pull in bzip2, which signature checks do not use.
pgp = { version = "0.21", default-features = false }
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# OpenSSL sidecars need PEM roots; read Windows trust through the OS, not a bundled list.
rustls-native-certs = "0.8"
base64 = "0.23"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
# Integration tests sign a checksum file with a key they hold. Same crate as above.
pgp = { version = "0.21", default-features = false }
rand = "0.10"

[lints]
workspace = true
