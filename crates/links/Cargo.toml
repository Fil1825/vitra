[package]
name = "links"
description = "Playing and downloading from links: URL classification, yt-dlp metadata, downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Already in the tree via Tauri; parses pasted links.
url = "2.5"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"

[lints]
workspace = true
