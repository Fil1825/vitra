[package]
name = "mpv-ipc"
description = "Async client for mpv's JSON IPC protocol, plus spawning mpv as a child process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
