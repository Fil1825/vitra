[package]
name = "themes"
description = "Vitra theme packages (.vitratheme): reading, writing and installing them safely"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Deflate only (what every zip tool writes), through flate2's pure-Rust backend.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
