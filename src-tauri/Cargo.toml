[package]
name = "vitra"
description = "Open-source desktop music player with a Liquid Glass look"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "vitra_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.1"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
mpv-ipc = { version = "0.1.0", path = "../crates/mpv-ipc" }
media = { version = "0.1.0", path = "../crates/media" }
tokio = { version = "1.54", features = ["sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Only to check the OS version for Liquid Glass; already in the tree via window-vibrancy.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
